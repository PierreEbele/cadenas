name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # bash : PowerShell réécrirait la sortie avec des fins de ligne CRLF.
      - run: node scripts/site-hashes.js > site-files.sha256
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-hashes-${{ matrix.os }}-node${{ matrix.node }}
          path: site-files.sha256

  # Le build du site est reproductible : sur chaque système et chaque version
  # de Node.js, les fichiers construits doivent être identiques au bit près.
  reproducible:
    name: Build reproductible
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: site-hashes-*
      - name: Les six builds sont identiques
        run: |
          reference=site-hashes-ubuntu-latest-node24/site-files.sha256
          cat "$reference"
          status=0
          for file in site-hashes-*/site-files.sha256; do
            if ! diff -u "$reference" "$file"; then
              echo "::error::$(dirname "$file") diffère du build de référence (ubuntu-latest, Node 24)"
              status=1
            fi
          done
          exit $status

  quality:
    name: Lint et couverture des tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Échoue si moins de 80 % des lignes de src/ et bin/ sont couvertes.
      - run: npm run test:coverage

  e2e:
    name: Tests du site (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  age-interop:
    name: Interopérabilité avec age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y age expect
      - name: cadenas chiffre, age déchiffre
        run: |
          echo "fichier de test $(date)" > plain.txt
          echo "mot de passe" | node bin/cadenas.js lock --age --password-stdin plain.txt
          expect -c '
            spawn age -d -o from-age.txt plain.txt.age
            expect "passphrase"
            send "mot de passe\r"
            expect eof
          '
          cmp plain.txt from-age.txt
      - name: age chiffre, cadenas déchiffre
        run: |
          expect -c '
            spawn age -p -o by-age.age plain.txt
            expect "passphrase"
            send "autre mot de passe\r"
            expect "Confirm"
            send "autre mot de passe\r"
            expect eof
          '
          echo "autre mot de passe" | node bin/cadenas.js unlock --password-stdin -o from-cadenas.txt by-age.age
          cmp plain.txt from-cadenas.txt

  docker:
    name: Image Docker (build et test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t cadenas:ci .
      - name: Le site répond avec les en-têtes de sécurité
        run: |
          docker run -d --name cadenas --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 cadenas:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi "content-security-policy: .*connect-src 'none'"
          echo "$headers" | grep -qi "x-content-type-options: nosniff"
          curl -fsS http://localhost:8080/ | grep -q "<title>cadenas"
          # Service worker : sa propre CSP (connect-src 'self'), jamais celle de la page.
          curl -fsSI http://localhost:8080/sw.js | grep -qi "content-security-policy: default-src 'none'; connect-src 'self'"
          curl -fsSI http://localhost:8080/manifest.webmanifest | grep -qi "content-type: application/manifest+json"
          test "$(docker exec cadenas id -u)" != "0"
      - if: always()
        run: docker logs cadenas || true
