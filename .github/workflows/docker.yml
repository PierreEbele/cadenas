name: Publication Docker

# Publie l'image sur GitHub Container Registry à chaque version (tag v*),
# avec SBOM et attestation de provenance (BuildKit), puis la signe sans clé
# avec cosign (Sigstore). Vérification : voir SECURITY.md.
on:
  push:
    tags: ['v*']
  # Lancement manuel : sur un tag, même parcours que ci-dessus ; sur une
  # branche, l'image est construite sans être publiée.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Signature du tag, vérifiée par le script de la branche main et non par
  # celui de l'arbre tagué : un commit tagué ne peut pas remplacer le code qui
  # le vérifie. Le workflow lui-même est lu dans le commit tagué : ce contrôle
  # ne protège donc pas contre qui peut modifier les workflows (voir
  # SECURITY.fr.md, « Tags de version »).
  # Lancé à la main sur une branche, rien n'est vérifié : verified reste vide
  # et l'image est seulement construite, sans être publiée ni signée.
  verify-tag:
    name: Signature du tag
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
      - id: verify
        name: Le tag est signé par le mainteneur
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          node scripts/verify-tag.js "$GITHUB_REF_NAME"
          echo "verified=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUBLISH: ${{ needs.verify-tag.outputs.verified == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pierreebele/cadenas
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signature de l'image (cosign, sans clé)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/pierreebele/cadenas@${DIGEST}"
