name: Release

# À chaque tag de version : crée la release GitHub avec les notes du
# CHANGELOG, et y joint le site construit (archive + empreintes SHA-256) et
# les exécutables autonomes de la CLI (Linux, macOS, Windows), le tout
# accompagné d'une attestation de provenance signée (Sigstore).
on:
  push:
    tags: ['v*']
  # Lancement manuel : construit et teste tout, sans rien publier.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Noms de fichiers : « / » (branche lancée à la main) devient « - ».
      - name: Archive et empreintes
        run: |
          mkdir -p release
          node scripts/site-hashes.js > release/site-files.sha256
          (cd dist && zip -qrX "../release/cadenas-site-${GITHUB_REF_NAME////-}.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: release/

  binaries:
    name: Exécutable ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # SignPath lit l'artefact à signer
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, ext: '' }
          - { os: ubuntu-24.04-arm, name: linux-arm64, ext: '' }
          - { os: macos-latest, name: macos-arm64, ext: '' }
          - { os: windows-latest, name: windows-x64, ext: '.exe' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construction
        shell: bash
        run: |
          mkdir -p release
          node scripts/build-sea.js "release/cadenas-${GITHUB_REF_NAME////-}-${{ matrix.name }}${{ matrix.ext }}"
      # Windows : signature de code par SignPath, avec le certificat de la
      # SignPath Foundation (docs/CODE_SIGNING.md). Seulement pour un tag, et
      # une fois la variable SIGNPATH_ORGANIZATION_ID définie.
      - id: unsigned
        if: matrix.name == 'windows-x64' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-x64
          path: release/*.exe
          retention-days: 1
      - if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: cadenas
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release
      - name: Signature Authenticode valide
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature (Get-Item release/*.exe)
          $signature | Format-List Status, SignerCertificate
          if ($signature.Status -ne 'Valid') { throw "Signature invalide : $($signature.Status)" }
      - name: Test de l'exécutable
        shell: bash
        run: |
          exe="release/cadenas-${GITHUB_REF_NAME////-}-${{ matrix.name }}${{ matrix.ext }}"
          test "$("$exe" --version)" = "$(node -p "require('./package.json').version")"
          echo "mot de passe" > pwd.txt
          head -c 300000 /dev/urandom > data.bin
          "$exe" lock - --password-file pwd.txt < data.bin > data.cadenas
          "$exe" unlock - --password-file pwd.txt < data.cadenas > data.out
          cmp data.bin data.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: release/

  publish:
    name: Publication de la release
    needs: [site, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Le tag est signé par le mainteneur
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          node scripts/verify-tag.js "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Empreintes de tous les fichiers publiés
        run: (cd release && sha256sum -- * | grep -v ' SHA256SUMS$') > SHA256SUMS && mv SHA256SUMS release/
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      # La provenance signée est aussi jointe à la release, pour une
      # vérification hors ligne : le bundle Sigstore complet, et l'enveloppe
      # DSSE seule au format SLSA (in-toto JSONL).
      - name: Provenance jointe à la release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "release/cadenas-${GITHUB_REF_NAME}.sigstore.json"
          node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            const bundle = lines.length === 1 && JSON.parse(lines[0]);
            if (!bundle?.dsseEnvelope) { console.error("::error::bundle de provenance inattendu"); process.exit(1); }
            console.log(JSON.stringify(bundle.dsseEnvelope));
          ' "$BUNDLE" > "release/cadenas-${GITHUB_REF_NAME}.intoto.jsonl"
      - name: Notes et création de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.js "$version" > notes.md
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
              --title "${title:-$GITHUB_REF_NAME}" --notes-file notes.md
          fi

  # Paquets Homebrew et winget, une fois la release publiée. Chacun a besoin
  # de son propre jeton (voir packaging/README.md) : sans lui, le job ne
  # publie rien et laisse un avertissement.
  homebrew:
    name: Formule Homebrew
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Jeton du dépôt homebrew-cadenas
        id: token
        run: |
          if [ -n "$TAP_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::Secret HOMEBREW_TAP_TOKEN absent : formule Homebrew non publiée (voir packaging/README.md)."
          echo "ok=false" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Le paquet npm est publié par un autre workflow (npm.yml), en parallèle.
      - name: Le paquet npm est publié
        if: steps.token.outputs.ok == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 40); do
            npm view "cadenas@$version" version > /dev/null 2>&1 && exit 0
            sleep 15
          done
          echo "::error::cadenas@$version n'est pas sur npm après 10 minutes."
          exit 1
      - name: Formule
        if: steps.token.outputs.ok == 'true'
        run: node scripts/packaging.js "$GITHUB_REF_NAME" --homebrew
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PierreEbele/homebrew-cadenas
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      # Installée, testée et auditée avant d'être envoyée : une formule cassée
      # n'est jamais publiée.
      - name: Test et publication de la formule
        if: steps.token.outputs.ok == 'true'
        run: |
          cp packaging/homebrew/cadenas.rb tap/Formula/cadenas.rb
          cd tap
          if git diff --quiet; then echo "Formule déjà à jour."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "cadenas ${GITHUB_REF_NAME#v}"
          brew tap pierreebele/cadenas "$PWD"
          brew install --build-from-source pierreebele/cadenas/cadenas
          brew test pierreebele/cadenas/cadenas
          brew audit --strict --online pierreebele/cadenas/cadenas
          git push origin HEAD:main

  winget:
    name: Manifeste winget
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Jeton pour microsoft/winget-pkgs
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::Secret WINGET_TOKEN absent : manifeste winget non soumis (voir packaging/README.md)."
          echo "ok=false" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Manifestes
        if: steps.token.outputs.ok == 'true'
        run: node scripts/packaging.js "$GITHUB_REF_NAME" --winget
      # Soumission par l'API GitHub, depuis le fork de microsoft/winget-pkgs du
      # propriétaire du jeton : pas de clone de ce dépôt immense.
      - name: Pull request vers microsoft/winget-pkgs
        if: steps.token.outputs.ok == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner=$(gh api user --jq .login)
          fork="$owner/winget-pkgs"
          gh repo view "$fork" > /dev/null 2>&1 || gh repo fork microsoft/winget-pkgs --clone=false --default-branch-only
          branch="PierreEbele.cadenas-$version"
          base=$(gh api repos/microsoft/winget-pkgs/git/ref/heads/master --jq .object.sha)
          gh api -X POST "repos/$fork/git/refs" -f ref="refs/heads/$branch" -f sha="$base" > /dev/null
          dir="packaging/winget/manifests/p/PierreEbele/cadenas/$version"
          for file in "$dir"/*.yaml; do
            gh api -X PUT "repos/$fork/contents/manifests/p/PierreEbele/cadenas/$version/$(basename "$file")" \
              -f message="Update: PierreEbele.cadenas to $version" \
              -f content="$(base64 -w0 "$file")" -f branch="$branch" > /dev/null
          done
          sed "s/{version}/$version/g" packaging/winget/pull-request.md > body.md
          gh pr create -R microsoft/winget-pkgs --base master --head "$owner:$branch" \
            --title "Update: PierreEbele.cadenas to $version" --body-file body.md
