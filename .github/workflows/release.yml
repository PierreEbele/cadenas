name: Release

# À chaque tag de version : crée la release GitHub avec les notes du
# CHANGELOG, et y joint le site construit (archive + empreintes SHA-256) et
# les exécutables autonomes de la CLI (Linux, macOS, Windows), le tout
# accompagné d'une attestation de provenance signée (Sigstore).
on:
  push:
    tags: ['v*']
  # Lancement manuel : construit et teste tout, sans rien publier.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Archive et empreintes
        run: |
          mkdir -p release
          (cd dist && find . -type f | LC_ALL=C sort | xargs sha256sum) > release/site-files.sha256
          (cd dist && zip -qrX "../release/cadenas-site-${GITHUB_REF_NAME}.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: release/

  binaries:
    name: Exécutable ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, ext: '' }
          - { os: ubuntu-24.04-arm, name: linux-arm64, ext: '' }
          - { os: macos-latest, name: macos-arm64, ext: '' }
          - { os: windows-latest, name: windows-x64, ext: '.exe' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construction
        shell: bash
        run: |
          mkdir -p release
          node scripts/build-sea.js "release/cadenas-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.ext }}"
      - name: Test de l'exécutable
        shell: bash
        run: |
          exe="release/cadenas-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.ext }}"
          test "$("$exe" --version)" = "$(node -p "require('./package.json').version")"
          echo "mot de passe" > pwd.txt
          head -c 300000 /dev/urandom > data.bin
          "$exe" lock - --password-file pwd.txt < data.bin > data.cadenas
          "$exe" unlock - --password-file pwd.txt < data.cadenas > data.out
          cmp data.bin data.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: release/

  publish:
    name: Publication de la release
    needs: [site, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Le tag est signé par le mainteneur
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          node scripts/verify-tag.js "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Empreintes de tous les fichiers publiés
        run: (cd release && sha256sum -- * | grep -v ' SHA256SUMS$') > SHA256SUMS && mv SHA256SUMS release/
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      # La provenance signée est aussi jointe à la release, pour une
      # vérification hors ligne : le bundle Sigstore complet, et l'enveloppe
      # DSSE seule au format SLSA (in-toto JSONL).
      - name: Provenance jointe à la release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "release/cadenas-${GITHUB_REF_NAME}.sigstore.json"
          node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            const bundle = lines.length === 1 && JSON.parse(lines[0]);
            if (!bundle?.dsseEnvelope) { console.error("::error::bundle de provenance inattendu"); process.exit(1); }
            console.log(JSON.stringify(bundle.dsseEnvelope));
          ' "$BUNDLE" > "release/cadenas-${GITHUB_REF_NAME}.intoto.jsonl"
      - name: Notes et création de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.js "$version" > notes.md
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
              --title "${title:-$GITHUB_REF_NAME}" --notes-file notes.md
          fi
