# cadenas ne fait que servir des fichiers statiques : le chiffrement a lieu
# dans le navigateur, le serveur ne voit jamais ni fichier ni mot de passe.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Rien d'utile à journaliser : pas de données utilisateur côté serveur.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/wasm application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker (hors ligne) : il doit pouvoir télécharger les fichiers du
    # site pour les mettre en cache, d'où connect-src 'self' — pour lui seul :
    # la page, elle, garde connect-src 'none'. Jamais mis en cache HTTP, pour
    # que les mises à jour soient détectées.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fichiers générés par Vite : leur nom contient une empreinte du contenu.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
