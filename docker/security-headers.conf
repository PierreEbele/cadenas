# En-têtes de sécurité, inclus dans chaque bloc (nginx n'hérite pas des
# add_header dès qu'un bloc location en définit un).
#
# connect-src 'none' : la page ne peut ouvrir aucune connexion réseau
# (fetch, XHR, WebSocket…). C'est la garantie technique que rien ne sort.
# 'wasm-unsafe-eval' : nécessaire à Argon2id (WebAssembly).
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; frame-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
